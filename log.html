<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f3d2e">
<title>Position Log</title>
<style>
  :root{
    --bg:#f4f6f4;
    --card:#ffffff;
    --text:#14201a;
    --muted:#5b6b62;
    --accent:#1f7a54;
    --danger:#b03a3a;
    --border:#e1e6e2;
    --shadow:0 2px 10px rgba(20,32,26,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1512;
      --card:#182019;
      --text:#e9efe9;
      --muted:#93a39a;
      --accent:#3ecb8c;
      --danger:#e07a7a;
      --border:#263129;
      --shadow:0 2px 12px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:22px 20px 14px;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:0.02em;
  }
  header a{
    display:inline-block;
    margin-top:6px;
    font-size:0.82rem;
    font-weight:600;
    color:var(--muted);
    text-decoration:none;
  }
  main{
    max-width:420px;
    margin:0 auto;
    padding:0 16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px 18px;
    margin-bottom:12px;
  }
  .actions-card{
    display:flex;
    gap:10px;
  }
  .btn{
    font-family:inherit;
    font-size:0.9rem;
    font-weight:600;
    border:none;
    border-radius:12px;
    padding:12px 16px;
    cursor:pointer;
    color:#ffffff;
    background:var(--accent);
    flex:1;
  }
  .btn.danger{
    background:var(--danger);
  }
  .btn:active{
    opacity:0.85;
  }
  .count{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    margin-bottom:14px;
  }
  .entry-time{
    font-size:0.78rem;
    color:var(--muted);
    font-weight:600;
  }
  .entry-coords{
    font-size:0.95rem;
    font-weight:700;
    margin-top:2px;
  }
  .entry-meta{
    font-size:0.82rem;
    color:var(--muted);
    margin-top:4px;
  }
  .entry-desc{
    margin-top:8px;
    font-size:0.9rem;
    padding-top:8px;
    border-top:1px solid var(--border);
  }
  .entry-footer{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
  }
  .delete-btn{
    font-family:inherit;
    font-size:0.75rem;
    font-weight:600;
    color:var(--danger);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px 8px;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:0.9rem;
    padding:30px 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Position Log</h1>
  <a id="backLink" href="terrain-test.html">&larr; Back to grid</a>
</header>

<main>
  <div class="card actions-card">
    <button id="copyBtn" class="btn">Copy All</button>
    <button id="clearBtn" class="btn danger">Clear Log</button>
  </div>
  <div id="count" class="count"></div>
  <div id="entries"></div>
</main>

<script>
(function(){
  const LOG_KEY = 'terrainPositionLog';

  // ?back=terrain-hex/ sends "Back to grid" to the hex page; only known pages
  // are accepted so the link can't be pointed anywhere else.
  const BACK_PAGES = ['terrain-test.html', 'terrain-hex/'];
  const back = new URLSearchParams(location.search).get('back');
  if(BACK_PAGES.includes(back)) document.getElementById('backLink').href = back;

  const entriesEl = document.getElementById('entries');
  const countEl = document.getElementById('count');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');

  function readLog(){
    try{ return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }
    catch(e){ return []; }
  }

  function writeLog(log){
    localStorage.setItem(LOG_KEY, JSON.stringify(log));
  }

  function formatTime(iso){
    const d = new Date(iso);
    return d.toLocaleString();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatLine(e){
    let line = formatTime(e.time) + ' | ' + e.lat.toFixed(6) + ', ' + e.lon.toFixed(6) +
      ' | ' + e.database + ' | ' + e.biome;
    if(e.description) line += ' | ' + e.description;
    return line;
  }

  function render(){
    const log = readLog();
    countEl.textContent = log.length + (log.length === 1 ? ' position logged' : ' positions logged');

    if(!log.length){
      entriesEl.innerHTML = '<div class="empty">No positions logged yet.</div>';
      return;
    }

    entriesEl.innerHTML = log.map((e, idx) => {
      return '<div class="card">' +
        '<div class="entry-time">' + formatTime(e.time) + '</div>' +
        '<div class="entry-coords">' + e.lat.toFixed(6) + ', ' + e.lon.toFixed(6) + '</div>' +
        '<div class="entry-meta">' + escapeHtml(e.database) + ' &middot; ' + escapeHtml(e.biome) + '</div>' +
        (e.description ? '<div class="entry-desc">' + escapeHtml(e.description) + '</div>' : '') +
        '<div class="entry-footer"><button class="delete-btn" data-idx="' + idx + '">Delete</button></div>' +
      '</div>';
    }).reverse().join('');
  }

  entriesEl.addEventListener('click', (e) => {
    if(!e.target.classList.contains('delete-btn')) return;
    const idx = parseInt(e.target.dataset.idx, 10);
    const log = readLog();
    log.splice(idx, 1);
    writeLog(log);
    render();
  });

  copyBtn.addEventListener('click', () => {
    const log = readLog();
    if(!log.length) return;
    const text = log.map(formatLine).join('\n');
    navigator.clipboard.writeText(text).then(() => {
      const original = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = original; }, 1500);
    }).catch(() => {
      alert('Could not copy automatically. Long-press to select and copy the log manually.');
    });
  });

  clearBtn.addEventListener('click', () => {
    if(!readLog().length) return;
    if(confirm('Clear all logged positions? This cannot be undone.')){
      localStorage.removeItem(LOG_KEY);
      render();
    }
  });

  render();
})();
</script>

</body>
</html>
